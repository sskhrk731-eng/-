<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#164b48">
  <meta name="description" content="小学5・6年生向け。5教科をまぜた4択クイズで復習する学習アプリ。">
  <title>Study Shuffle｜5教科をまぜて復習</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23164b48'/%3E%3Cpath d='M8 9h5l6 14h5M8 23h5l6-14h5' fill='none' stroke='%23e4ee91' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    :root {
      font-family: "Yu Gothic", "游ゴシック", YuGothic,
        "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: #203531;
      background: #f5f7f6;
      line-height: 1.7;
      --ink: #203531;
      --teal: #164b48;
      --muted: #63716c;
      --line: #dce3df;
      --lime: #e4ee91;
      --red: #a72c38;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button { cursor: pointer; line-height: 1.4; }
    button:disabled { cursor: default; }
    button, a, input, summary { touch-action: manipulation; }
    a { color: inherit; }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { line-height: 1.45; }
    h1 { font-size: 2rem; }
    h2 { font-size: 1.3rem; }
    p { overflow-wrap: anywhere; }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible,
    input:focus-visible + span {
      outline: 3px solid #397cda;
      outline-offset: 4px;
    }

    .site-header {
      max-width: 1160px;
      margin: auto;
      padding: 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      text-decoration: none;
      font-size: 1.3rem;
      letter-spacing: -.035em;
      font-weight: 500;
    }

    .brand strong { font-weight: 800; }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--teal);
      display: grid;
      place-items: center;
    }

    .brand-mark svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--lime);
      stroke-width: 2.6;
      stroke-linecap: round;
    }

    .age-label {
      font-size: .875rem;
      color: var(--muted);
    }

    main {
      max-width: 1000px;
      margin: 36px auto 0;
      padding: 0 32px;
      min-height: calc(100svh - 260px);
    }

    main:focus { outline: none; }

    .eyebrow {
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--teal);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .eyebrow::before {
      content: "";
      width: 23px;
      height: 2px;
      background: currentColor;
    }

    .intro { margin-bottom: 32px; }

    .intro h1 {
      font-size: clamp(1.8rem, 4.5vw, 2.7rem);
      letter-spacing: .025em;
    }

    .intro p {
      color: var(--muted);
      margin-top: 13px;
      font-size: 1rem;
    }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      background: white;
      box-shadow: 0 9px 30px #18362b06;
    }

    .subject-panel {
      background: var(--teal);
      color: white;
      padding: 34px;
      display: flex;
      flex-direction: column;
    }

    .small-label {
      font-size: .875rem;
      letter-spacing: .05em;
      font-weight: 600;
    }

    .subject-panel > .small-label { color: #d8e5df; }

    .subject-list {
      list-style: none;
      padding: 0;
      margin: 20px 0 32px;
      display: grid;
    }

    .subject-list li {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #ffffff24;
      font-weight: 600;
    }

    .subject-list li:last-child { border-bottom: 0; }

    .subject-symbol {
      display: inline-grid;
      place-items: center;
      width: 35px;
      height: 35px;
      background: #ffffff12;
      border: 1px solid #ffffff3b;
      border-radius: 9px;
      color: var(--lime);
    }

    .subject-list .topic {
      margin-left: auto;
      font-size: .875rem;
      font-weight: 400;
      color: #cfdfd6;
    }

    .mix-note {
      margin-top: auto;
      font-size: .875rem;
      color: #d8e5df;
      border-left: 2px solid var(--lime);
      padding-left: 14px;
    }

    .mix-note strong { color: white; }

    .setup {
      padding: 34px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .setup h2 { font-size: 1.25rem; }

    fieldset {
      border: 0;
      padding: 0;
      margin: 0;
      min-width: 0;
    }

    legend {
      font-size: .875rem;
      font-weight: 700;
      padding: 0;
      margin-bottom: 10px;
    }

    .segmented {
      display: flex;
      padding: 4px;
      background: #f2f5f3;
      border: 1px solid #e6ebe7;
      border-radius: 12px;
      gap: 4px;
    }

    .segmented label {
      position: relative;
      flex: 1;
      cursor: pointer;
    }

    .segmented input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
    }

    .segmented span {
      display: block;
      text-align: center;
      padding: 10px 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 1rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .segmented input:checked + span {
      background: white;
      color: var(--teal);
      border-color: #cad9cf;
      box-shadow: 0 2px 4px #164b4808;
      font-weight: 700;
    }

    .hint {
      font-size: .8125rem;
      color: var(--muted);
      margin-top: 8px;
    }

    .start-area { margin-top: auto; }

    .primary,
    .secondary,
    .text-button {
      border-radius: 10px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: 1px solid transparent;
      min-height: 50px;
      transition: background .15s, transform .15s;
    }

    .primary {
      background: var(--teal);
      color: white;
    }

    .primary:hover { background: #23615b; }

    .primary:active,
    .secondary:active {
      transform: translateY(1px);
    }

    .start-button {
      background: var(--lime);
      color: #1d3c2a;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
    }

    .start-button:hover { background: #d5e378; }

    .start-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
    }

    .secondary {
      background: white;
      border-color: #cdd8d1;
      color: var(--teal);
    }

    .secondary:hover { background: #edf3ef; }

    .text-button {
      padding: 8px 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 500;
      min-height: 42px;
    }

    .text-button:hover {
      background: #eaf0ed;
      color: var(--teal);
    }

    .session-summary {
      text-align: center;
      font-size: .8125rem;
      color: var(--muted);
      margin-top: 10px;
    }

    .steps {
      display: flex;
      justify-content: center;
      gap: 35px;
      margin: 28px 0;
      color: var(--muted);
      font-size: .875rem;
    }

    .steps div {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .steps span {
      display: grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border: 1px solid #d0dbd5;
      border-radius: 50%;
      font-size: .75rem;
      color: var(--teal);
    }

    .how-to {
      border-top: 1px solid var(--line);
      margin-top: 22px;
      padding-top: 18px;
      font-size: .875rem;
      color: var(--muted);
    }

    .how-to summary {
      cursor: pointer;
      width: fit-content;
      color: var(--teal);
      font-weight: 600;
    }

    .how-to p {
      margin-top: 12px;
      max-width: 720px;
    }

    .question-count-label {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: .875rem;
    }

    .play-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 12px;
    }

    .play-header h1 { font-size: 1.125rem; }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 24px;
    }

    .progress-dots {
      display: flex;
      gap: 7px;
      flex: 1;
      min-width: 0;
    }

    .progress-dot {
      height: 6px;
      flex: 1;
      background: #dce4de;
      border-radius: 3px;
    }

    .progress-dot.done { background: var(--teal); }
    .progress-dot.current { background: #a7be48; }

    .question-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 38px 30px;
      box-shadow: 0 8px 35px #193b2c04;
    }

    .question-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 23px;
    }

    .subject-tag {
      font-size: .875rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      border: 1px solid color-mix(in srgb, var(--subject), white 76%);
      background: color-mix(in srgb, var(--subject), white 95%);
      color: var(--subject);
      padding: 5px 11px;
      border-radius: 7px;
      white-space: nowrap;
    }

    .subject-tag span {
      font-size: .75rem;
      opacity: .7;
      border-left: 1px solid currentColor;
      padding-left: 8px;
    }

    .timer {
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      white-space: nowrap;
    }

    .timer svg {
      height: 19px;
      width: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
    }

    .timer strong {
      font-size: 1.15rem;
      color: var(--ink);
    }

    .timer.urgent,
    .timer.urgent strong {
      color: var(--red);
    }

    .timer-bar {
      height: 3px;
      background: #edf0ec;
      border-radius: 3px;
      margin-top: -12px;
      margin-bottom: 26px;
      overflow: hidden;
    }

    .timer-bar div {
      height: 100%;
      background: #9eb872;
      transition: width .2s linear;
    }

    .timer-bar.urgent div { background: #c76b5f; }

    .question-title {
      font-size: clamp(1.25rem, 2.9vw, 1.65rem);
      line-height: 1.75;
      margin-bottom: 26px;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }

    .question-title:focus,
    .feedback-title:focus,
    .result-title:focus {
      outline: none;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 82px;
      padding: 17px 18px;
      text-align: left;
      border: 1.5px solid #dce4de;
      border-radius: 12px;
      background: white;
      color: var(--ink);
      font-size: 1.05rem;
      transition: border-color .15s, background .15s;
    }

    .answer:not(:disabled):hover {
      border-color: #548776;
      background: #f4f8f4;
    }

    .answer-letter {
      flex: 0 0 27px;
      width: 27px;
      height: 27px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      background: #f0f4f1;
      color: #738177;
      font-size: .8125rem;
      font-weight: 700;
    }

    .answer-text {
      flex: 1;
      overflow-wrap: anywhere;
    }

    .answer-status {
      font-size: .75rem;
      white-space: nowrap;
      font-weight: 700;
    }

    .answer.correct {
      background: #edf7ef;
      border-color: #3e8661;
      color: #185b3d;
    }

    .answer.correct .answer-letter {
      background: #c7e3d0;
      color: #185b3d;
    }

    .answer.wrong {
      background: #fff0ef;
      border-color: #c66b6b;
      color: #9c2d36;
    }

    .answer.wrong .answer-letter {
      background: #f2d4d2;
      color: #9c2d36;
    }

    .answer.dim {
      color: #758079;
      background: #fafbfa;
      border-color: #e7ece8;
    }

    .question-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 21px;
      color: var(--muted);
      font-size: .8125rem;
    }

    .feedback {
      margin-top: 22px;
      padding: 22px 24px;
      background: #f1f6f2;
      border-radius: 12px;
      border-left: 3px solid #508b61;
      animation: appear .18s ease;
    }

    .feedback.incorrect {
      background: #f8f4ed;
      border-color: #b88736;
    }

    .feedback-title {
      font-size: 1.2rem;
      color: #225e3c;
      margin-bottom: 8px;
    }

    .feedback.incorrect .feedback-title { color: #835416; }

    .correct-answer {
      font-weight: 700;
      margin-bottom: 7px;
    }

    .feedback p {
      font-size: 1rem;
      line-height: 1.9;
    }

    .feedback-actions {
      margin-top: 21px;
      display: flex;
      justify-content: flex-end;
    }

    .feedback-actions button { min-width: 200px; }

    .below-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      gap: 16px;
    }

    .below-card p {
      font-size: .8125rem;
      color: var(--muted);
    }

    .results {
      max-width: 810px;
      margin: auto;
    }

    .result-banner {
      background: var(--teal);
      color: white;
      border-radius: 18px;
      padding: 30px 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .result-banner .eyebrow {
      color: var(--lime);
      margin-bottom: 10px;
    }

    .result-banner h1 { font-size: 1.65rem; }

    .result-banner p {
      color: #d4e5dc;
      font-size: .875rem;
      margin-top: 7px;
    }

    .score {
      white-space: nowrap;
      display: flex;
      align-items: baseline;
      gap: 7px;
      font-variant-numeric: tabular-nums;
    }

    .score strong {
      font-size: 4rem;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.05em;
    }

    .score span {
      font-size: 1rem;
      color: #d4e5dc;
    }

    .result-content {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-top: 18px;
      padding: 27px 32px;
    }

    .result-top {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }

    .result-top h2 { font-size: 1.05rem; }

    .result-top span {
      font-size: .8125rem;
      color: var(--muted);
    }

    .subject-results {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .result-subject {
      font-size: .875rem;
      color: var(--subject);
      font-weight: 700;
    }

    .result-numbers {
      margin: 7px 0;
      display: flex;
      gap: 4px;
      align-items: baseline;
      font-variant-numeric: tabular-nums;
    }

    .result-numbers strong { font-size: 1.6rem; }

    .result-numbers span {
      font-size: .875rem;
      color: var(--muted);
    }

    .result-meter {
      height: 4px;
      background: #e7ece9;
      border-radius: 3px;
      overflow: hidden;
    }

    .result-meter div {
      height: 100%;
      background: var(--subject);
    }

    .result-actions {
      display: grid;
      gap: 11px;
      margin-top: 24px;
    }

    .result-actions .primary { width: 100%; }

    .actions-row {
      display: flex;
      gap: 12px;
    }

    .actions-row button { flex: 1; }

    .review-section { margin-top: 27px; }

    .review-section h2 {
      font-size: 1.1rem;
      margin-bottom: 10px;
    }

    .review-item {
      border-bottom: 1px solid var(--line);
      padding: 15px 0;
    }

    .review-item summary {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: .9375rem;
      list-style: none;
    }

    .review-item summary::-webkit-details-marker { display: none; }

    .review-item summary::after {
      content: "＋";
      margin-left: auto;
      color: var(--muted);
    }

    .review-item[open] summary::after { content: "−"; }

    .review-icon {
      color: var(--red);
      font-size: 1.2rem;
    }

    .review-item p {
      font-size: .9375rem;
      margin-top: 10px;
      color: var(--muted);
    }

    .review-item p strong { color: var(--ink); }

    .result-note {
      font-size: .8125rem;
      color: var(--muted);
      margin-top: 19px;
    }

    .site-footer {
      max-width: 1160px;
      display: flex;
      justify-content: space-between;
      margin: 50px auto 0;
      padding: 23px 32px 28px;
      color: #758278;
      font-size: .75rem;
      gap: 20px;
    }

    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip {
      position: absolute;
      left: 16px;
      top: -80px;
      background: white;
      padding: 12px;
      z-index: 10;
    }

    .skip:focus { top: 12px; }

    dialog {
      max-width: 460px;
      width: calc(100% - 36px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px;
      color: var(--ink);
      box-shadow: 0 20px 80px #10271c33;
    }

    dialog::backdrop { background: #10292077; }

    dialog p {
      margin-top: 12px;
      color: var(--muted);
    }

    .dialog-actions {
      display: flex;
      gap: 12px;
      margin-top: 25px;
    }

    .dialog-actions button { flex: 1; }

    .noscript {
      padding: 30px;
      text-align: center;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 1000px) {
      main:has(.question-card) { max-width: 880px; }
    }

    @media (max-width: 700px) {
      .site-header { padding: 20px 22px; }
      .brand { font-size: 1.15rem; }
      .brand-mark { width: 32px; height: 32px; }
      .age-label { font-size: .75rem; }

      main {
        margin-top: 24px;
        padding: 0 20px;
        min-height: calc(100svh - 218px);
      }

      .intro { margin-bottom: 23px; }
      .intro p { font-size: .9375rem; line-height: 1.9; }
      .home-grid { grid-template-columns: 1fr; }
      .subject-panel { padding: 22px 24px; }

      .subject-panel > .small-label,
      .subject-list .topic,
      .mix-note {
        display: none;
      }

      .subject-list {
        display: flex;
        justify-content: space-between;
        margin: 0;
        gap: 12px;
      }

      .subject-list li {
        padding: 0;
        border: 0;
        display: flex;
        flex-direction: column;
        gap: 7px;
        font-size: .8125rem;
      }

      .subject-symbol { width: 34px; height: 34px; }
      .setup { padding: 25px; gap: 22px; }
      .setup h2 { font-size: 1.15rem; }

      .steps {
        gap: 18px;
        font-size: .8125rem;
        margin: 24px 0;
      }

      .steps div { gap: 6px; }
      .steps span { width: 20px; height: 20px; flex-shrink: 0; }
      .how-to { margin-top: 18px; }
      .site-footer { padding: 20px 22px; margin-top: 30px; }

      .question-card {
        padding: 23px 22px;
        border-radius: 16px;
      }

      .question-topline { margin-bottom: 20px; gap: 10px; }

      .question-title {
        font-size: 1.25rem;
        line-height: 1.8;
        margin-bottom: 22px;
      }

      .answers { grid-template-columns: 1fr; gap: 10px; }

      .answer {
        min-height: 61px;
        font-size: 1rem;
        padding: 12px 14px;
      }

      .progress-row { margin-bottom: 18px; gap: 12px; }
      .keyboard-hint { display: none; }
      .question-bottom { margin-top: 17px; }
      .feedback { padding: 17px 18px; margin-top: 20px; }
      .feedback p { font-size: .9375rem; }
      .feedback-actions { margin-top: 18px; }
      .feedback-actions button { width: 100%; }
      .below-card p { max-width: 70%; }

      .result-banner {

      function shuffle(items) {
        const result = [...items];

        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }

        return result;

      function makeDeck(count, previousIds = []) {

              pool.filter(question => !previousIds.includes(question.id))
            );

            const old = shuffle(
              pool.filter(question => previousIds.includes(question.id))
            );

            return [subject.id, [...fresh, ...old]];
          })
        );

        const deck = [];

        for (let round = 0; round < count / 5; round++) {
          const order = shuffle(subjects);

          if (
            deck.length > 0 &&
            deck[deck.length - 1].subject === order[0].id
          ) {
            [order[0], order[1]] = [order[1], order[0]];
          }

          for (const subject of order) {
            const question = buckets.get(subject.id).shift();

            deck.push({
              ...question,
              options: shuffle(question.options)
            });
          }
        }

        return deck;
      }

      function makeReviewDeck(missed) {
        return shuffle(missed).map(question => ({
          ...question,
          options: shuffle(question.options)
        }));
      }

      function scoreAnswers(answers) {
        return {
          total: answers.length,
          correct: answers.filter(answer => answer.correct).length,

          missed: answers
            .filter(answer => !answer.correct)
            .map(answer => answer.question),

          subjects: subjects.map(subject => ({
            ...subject,

            total: answers.filter(
              answer => answer.question.subject === subject.id
            ).length,

            correct: answers.filter(
              answer =>
                answer.question.subject === subject.id &&
                answer.correct
            ).length
          }))
        };
      }

      // =========================================
      // 画面・状態
      // =========================================

      const main = document.querySelector("#main");
      const dialog = document.querySelector("#quit-dialog");

      const clockIcon = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="13" r="8"/>
          <path d="M12 9v5l3 2M9 2h6M12 2v3"/>
        </svg>
      `;

      const shuffleIcon = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h5l6 12h5M4 18h5l6-12h5"/>
        </svg>
      `;

      function escape(value) {
        const characters = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        };

        return String(value).replace(
          /[&<>"']/g,
          character => characters[character]
        );
      }

      function findSubject(id) {
        return subjects.find(subject => subject.id === id);
      }

      let options = {
        count: 10,
        seconds: 30
      };

      let state = {
        phase: "home",
        deck: [],
        index: 0,
        answers: [],
        review: false
      };

      let previousIds = [];
      let timerId = null;
      let deadline = 0;
      let questionStarted = 0;
      let dialogOpenedAt = 0;
      let warned = false;

      function clearTimer() {
        clearInterval(timerId);
        timerId = null;
      }

      function announce(text) {
        document.querySelector("#announcement").textContent = text;
      }

      function focusAfterPaint(selector, top = false) {
        requestAnimationFrame(() => {
          main.querySelector(selector)?.focus({
            preventScroll: true
          });

          if (top) {
            window.scrollTo({
              top: 0,
              behavior: "instant"
            });
          }
        });
      }

      // =========================================
      // ホーム
      // =========================================

      function renderHome(focus = false) {
        clearTimer();

        state = {
          phase: "home",
          deck: [],
          index: 0,
          answers: [],
          review: false
        };

        main.innerHTML = `
          <section class="intro">
            <div class="eyebrow">LET'S SHUFFLE</div>
            <h1 tabindex="-1">いろんな教科を、少しずつ。</h1>
            <p>
              次は何の問題かな？
              5教科をまぜたクイズで、習ったことを思い出そう。
            </p>
          </section>

          <div class="home-grid">
            <section
              class="subject-panel"
              aria-labelledby="subjects-title"
            >
              <h2 id="subjects-title" class="small-label">
                今回も、5教科をシャッフル。
              </h2>

              <ul class="subject-list">
                ${subjects.map((subject, index) => `
                  <li>
                    <span class="subject-symbol" aria-hidden="true">
                      ${subject.symbol}
                    </span>
                    <span>${subject.name}</span>
                    <span class="topic">
                      ${[
                        "漢字・言葉",
                        "計算・図形",
                        "自然・実験",
                        "地理・歴史",
                        "単語・表現"
                      ][index]}
                    </span>
                  </li>
                `).join("")}
              </ul>

              <p class="mix-note">
                <strong>答えて、確かめて、もう一度。</strong><br>
                まちがえた問題は、あとで解き直せるよ。
              </p>
            </section>

            <form class="setup" id="setup-form">
              <h2>今日のチャレンジ</h2>

              <fieldset>
                <legend>何問やる？</legend>

                <div class="segmented">
                  ${[5, 10].map(count => `
                    <label>
                      <input
                        type="radio"
                        name="count"
                        value="${count}"
                        ${options.count === count ? "checked" : ""}
                      >
                      <span>${count}問</span>
                    </label>
                  `).join("")}
                </div>
              </fieldset>

              <fieldset>
                <legend>1問の制限時間</legend>

                <div class="segmented">
                  ${[0, 30, 60].map(seconds => `
                    <label>
                      <input
                        type="radio"
                        name="seconds"
                        value="${seconds}"
                        ${options.seconds === seconds ? "checked" : ""}
                      >
                      <span>${seconds ? seconds + "秒" : "なし"}</span>
                    </label>
                  `).join("")}
                </div>

                <p class="hint">
                  じっくり考えたいときは「なし」で。
                </p>
              </fieldset>

              <div class="start-area">
                <button class="primary start-button" type="submit">
                  ${shuffleIcon}
                  シャッフルして始める
                </button>

                <p class="session-summary" id="session-summary">
                  ${options.count}問・5教科ミックス
                </p>
              </div>
            </form>
          </div>

          <div class="steps" aria-label="学習の流れ">
            <div><span>1</span>4択で答える</div>
            <div><span>2</span>解説を読む</div>
            <div><span>3</span>解き直す</div>
          </div>

          <details class="how-to">
            <summary>遊び方と問題について</summary>

            <p>
              5問なら各教科1問、10問なら各教科2問を出題します。
              問題と選択肢の順番は毎回シャッフル。
              答えを選ぶと、正解と短い解説が表示されます。
              時間切れの問題も、最後に解き直せます。
            </p>

            <p>
              小学5・6年生で習う内容を中心に、これまでの復習も含めた
              オリジナル問題を60問用意しています。
              学年や教科書によって学ぶ順番は異なります。
              結果は今回の正答数です。
              学力や知識の定着を判定するテストではありません。
            </p>

            <p>
              学習結果はこの画面を開いている間だけ確認できます。
              ページを閉じたり、再読み込みしたりすると消えます。
            </p>
          </details>
        `;

        document.querySelector("#setup-form")
          .addEventListener("change", event => {
            if (event.target.name === "count") {
              options.count = Number(event.target.value);
            }

            if (event.target.name === "seconds") {
              options.seconds = Number(event.target.value);
            }

            document.querySelector("#session-summary").textContent =
              `${options.count}問・5教科ミックス`;
          });

        document.querySelector("#setup-form")
          .addEventListener("submit", event => {
            event.preventDefault();
            startSession();
          });

        if (focus) {
          focusAfterPaint("h1", true);
        }
      }

      // =========================================
      // クイズ開始・解き直し開始
      // =========================================

      function startSession(config = options) {
        if (
          ![5, 10].includes(config.count) ||
          ![0, 30, 60].includes(config.seconds)
        ) {
          throw new Error("問題数と制限時間を選び直してください。");
        }

        if (state.phase === "question") {
          throw new Error("今のチャレンジを終えてから始めてください。");
        }

        options = { ...config };

        const deck = makeDeck(options.count, previousIds);
        previousIds = deck.map(question => question.id);

        state = {
          phase: "question",
          deck,
          index: 0,
          answers: [],
          review: false
        };

        beginQuestion();
        return getPublicState();
      }

      function startReview() {
        if (state.phase !== "results") {
          throw new Error("結果画面から解き直しを始めてください。");
        }

        const missed = scoreAnswers(state.answers).missed;

        if (!missed.length) {
          throw new Error("解き直す問題はありません。");
        }

        clearTimer();

        state = {
          phase: "question",
          deck: makeReviewDeck(missed),
          index: 0,
          answers: [],
          review: true
        };

        beginQuestion();
        return getPublicState();
      }

      function beginQuestion() {
        questionStarted = performance.now();
        deadline = questionStarted + options.seconds * 1000;
        warned = false;

        renderQuestion();
        startTimer();
      }

      // =========================================
      // 問題画面
      // =========================================

      function renderQuestion() {
        const question = state.deck[state.index];
        const subject = findSubject(question.subject);
        const answer = state.answers[state.index];
        const correctCount =
          state.answers.filter(item => item.correct).length;

        const last = state.index === state.deck.length - 1;

        main.innerHTML = `
          <div class="play-header">
            <h1>
              ${state.review
                ? "まちがえた問題を解き直そう"
                : "シャッフルチャレンジ"}
            </h1>

            <button class="text-button" id="exit" type="button">
              やめる
            </button>
          </div>

          <div class="progress-row">
            <div
              class="progress-dots"
              role="progressbar"
              aria-label="回答した問題"
              aria-valuemin="0"
              aria-valuemax="${state.deck.length}"
              aria-valuenow="${state.answers.length}"
            >
              ${state.deck.map((_, index) => `
                <span class="progress-dot ${
                  index < state.answers.length
                    ? "done"
                    : index === state.index
                      ? "current"
                      : ""
                }"></span>
              `).join("")}
            </div>

            <span class="question-count-label">
              ${state.index + 1} / ${state.deck.length} 問
            </span>
          </div>

          <section
            class="question-card"
            aria-labelledby="question-title"
          >
            <div class="question-topline">
              <div
                class="subject-tag"
                style="--subject:${subject.color}"
              >
                ${subject.name}
                <span>${escape(question.topic)}</span>
              </div>

              <div class="timer" id="timer">
                ${clockIcon}

                <span>
                  ${state.review || options.seconds === 0
                    ? "時間制限なし"
                    : `あと
                        <strong id="seconds-left">
                          ${options.seconds}
                        </strong>
                        秒`}
                </span>
              </div>
            </div>

            ${!state.review && options.seconds > 0 && !answer
              ? `
                <div
                  class="timer-bar"
                  id="timer-bar"
                  aria-hidden="true"
                >
                  <div id="time-fill" style="width:100%"></div>
                </div>
              `
              : ""}

            <h2
              class="question-title"
              id="question-title"
              tabindex="-1"
            >
              ${escape(question.text)}
            </h2>

            <div
              class="answers"
              aria-label="答えを一つ選んでください"
            >
              ${question.options.map((choice, index) => {
                const isCorrect =
                  answer && choice === question.answer;

                const isSelected =
                  answer && choice === answer.selected;

                const status = isCorrect
                  ? "正解"
                  : isSelected
                    ? "選んだ答え"
                    : "";

                const className = answer
                  ? isCorrect
                    ? "correct"
                    : isSelected
                      ? "wrong"
                      : "dim"
                  : "";

                return `
                  <button
                    type="button"
                    class="answer ${className}"
                    data-answer="${index}"
                    ${answer ? "disabled" : ""}
                  >
                    <span class="answer-letter" aria-hidden="true">
                      ${String.fromCharCode(65 + index)}
                    </span>

                    <span class="answer-text">
                      ${escape(choice)}
                    </span>

                    ${status
                      ? `<span class="answer-status">${status}</span>`
                      : ""}
                  </button>
                `;
              }).join("")}
            </div>

            ${answer
              ? `
                <div class="feedback ${answer.correct ? "" : "incorrect"}">
                  <h3 class="feedback-title" tabindex="-1">
                    ${answer.correct
                      ? "正解！"
                      : answer.selected === null
                        ? "時間切れ。答えを確かめよう。"
                        : "おしい！ 解説を読んでみよう。"}
                  </h3>

                  ${!answer.correct
                    ? `
                      <p class="correct-answer">
                        正解：${escape(question.answer)}
                      </p>
                    `
                    : ""}

                  <p>${escape(question.explanation)}</p>
                </div>

                <div class="feedback-actions">
                  <button class="primary" id="next" type="button">
                    ${last ? "結果を見る" : "次の問題へ"}
                  </button>
                </div>
              `
              : `
                <div class="question-bottom">
                  <span>答えを一つ選ぼう</span>
                  <span class="keyboard-hint">
                    1〜4キーでも回答できます
                  </span>
                </div>
              `}
          </section>

          <div class="below-card">
            <p>
              ${state.review
                ? "解き直しは時間を気にせず、じっくり。"
                : answer
                  ? "解説を読み終えたら、次へ進もう。"
                  : "わからなくても大丈夫。答えたあとに確認しよう。"}
            </p>

            <span class="question-count-label">
              正解 ${correctCount} 問
            </span>
          </div>
        `;

        main.querySelectorAll("[data-answer]").forEach(button => {
          button.addEventListener("click", () => {
            submitAnswer(Number(button.dataset.answer));
          });
        });

        main.querySelector("#next")
          ?.addEventListener("click", nextQuestion);

        main.querySelector("#exit")
          .addEventListener("click", openQuit);

        if (answer) {
          if (!state.review && options.seconds > 0) {
            document.querySelector("#timer").innerHTML =
              `${clockIcon}<span>回答済み</span>`;
          }

          focusAfterPaint(".feedback-title");
        } else {
          focusAfterPaint("#question-title", true);
        }
      }

      // =========================================
      // タイマー
      // =========================================

      function startTimer() {
        clearTimer();

        if (options.seconds === 0 || state.review) {
          return;
        }

        timerId = setInterval(updateTimer, 100);
        updateTimer();
      }

      function updateTimer() {
        if (
          state.phase !== "question" ||
          state.answers[state.index] ||
          dialog.open ||
          options.seconds === 0 ||
          state.review
        ) {
          return;
        }

        const remaining = Math.max(0, deadline - performance.now());
        const label = document.querySelector("#seconds-left");
        const fill = document.querySelector("#time-fill");

        if (label) {
          label.textContent = String(Math.ceil(remaining / 1000));
        }

        if (fill) {
          fill.style.width =
            `${remaining / (options.seconds * 1000) * 100}%`;
        }

        document.querySelector("#timer")
          ?.classList.toggle("urgent", remaining <= 10000);

        document.querySelector("#timer-bar")
          ?.classList.toggle("urgent", remaining <= 10000);

        if (remaining <= 10000 && !warned) {
          announce("残り10秒です。");
          warned = true;
        }

        if (remaining <= 0) {
          submitAnswer(null);
        }
      }

      // =========================================
      // 回答・次の問題
      // =========================================

      function submitAnswer(index) {
        if (
          state.phase !== "question" ||
          state.answers[state.index]
        ) {
          throw new Error("今は回答できません。");
        }

        if (dialog.open) {
          throw new Error("学習に戻ってから回答してください。");
        }

        if (
          index !== null &&
          (!Number.isInteger(index) || index < 0 || index > 3)
        ) {
          throw new Error("選択肢は0から3の番号で指定してください。");
        }

        // 別のタブを見ている間に期限を過ぎた場合も時間切れにする。
        if (
          !state.review &&
          options.seconds > 0 &&
          performance.now() >= deadline
        ) {
          index = null;
        }

        clearTimer();

        const question = state.deck[state.index];
        const selected =
          index === null ? null : question.options[index];

        const elapsed = Math.max(
          0,
          (performance.now() - questionStarted) / 1000
        );

        state.answers.push({
          question,
          selected,
          correct: selected === question.answer,
          seconds: !state.review && options.seconds
            ? Math.min(options.seconds, elapsed)
            : elapsed
        });

        renderQuestion();
        return getPublicState();
      }

      function nextQuestion() {
        if (
          state.phase !== "question" ||
          !state.answers[state.index]
        ) {
          throw new Error("答えを選んでから次へ進んでください。");
        }

        if (dialog.open) {
          throw new Error("学習に戻ってから進んでください。");
        }

        if (state.index + 1 >= state.deck.length) {
          renderResults();
        } else {
          state.index++;
          beginQuestion();
        }

        return getPublicState();
      }

      // =========================================
      // 結果画面
      // =========================================

      function renderResults() {
        clearTimer();
        state.phase = "results";

        const score = scoreAnswers(state.answers);

        const totalSeconds = Math.round(
          state.answers.reduce(
            (sum, answer) => sum + answer.seconds,
            0
          )
        );

        const elapsedText = totalSeconds >= 60
          ? `${Math.floor(totalSeconds / 60)}分${totalSeconds % 60}秒`
          : `${totalSeconds}秒`;

        main.innerHTML = `
          <div class="results">
            <section class="result-banner">
              <div>
                <div class="eyebrow">
                  ${state.review
                    ? "REVIEW COMPLETE"
                    : "CHALLENGE COMPLETE"}
                </div>

                <h1 class="result-title" tabindex="-1">
                  ${score.correct === score.total
                    ? "全問正解、おみごと！"
                    : "おつかれさま！"}
                </h1>

                <p>
                  ${state.review
                    ? "解き直しの結果"
                    : "今回のチャレンジの結果"}
                </p>
              </div>

              <div class="score">
                <strong>${score.correct}</strong>
                <span>/ ${score.total} 問正解</span>
              </div>
            </section>

            <section
              class="result-content"
              aria-labelledby="results-title"
            >
              <div class="result-top">
                <h2 id="results-title">教科ごとの正解数</h2>
                <span>回答時間 ${elapsedText}</span>
              </div>

              <div class="subject-results">
                ${score.subjects.map(subject => `
                  <div
                    class="subject-result"
                    style="--subject:${subject.color}"
                  >
                    <div class="result-subject">
                      ${subject.name}
                    </div>

                    <div class="result-numbers">
                      <strong>
                        ${subject.total ? subject.correct : "−"}
                      </strong>
                      <span>
                        ${subject.total
                          ? "/ " + subject.total
                          : "出題なし"}
                      </span>
                    </div>

                    <div class="result-meter" aria-hidden="true">
                      <div style="width:${
                        subject.total
                          ? subject.correct / subject.total * 100
                          : 0
                      }%"></div>
                    </div>
                  </div>
                `).join("")}
              </div>

              <div class="result-actions">
                ${score.missed.length
                  ? `
                    <button class="primary" id="review" type="button">
                      まちがえた${score.missed.length}問を解き直す
                    </button>
                  `
                  : `
                    <p>
                      全部思い出せたね。
                      次は、また別の問題に挑戦してみよう。
                    </p>
                  `}

                <div class="actions-row">
                  <button
                    class="${score.missed.length ? "secondary" : "primary"}"
                    id="again"
                    type="button"
                  >
                    新しい問題でチャレンジ
                  </button>

                  <button class="secondary" id="home" type="button">
                    ホームに戻る
                  </button>
                </div>
              </div>

              ${score.missed.length
                ? `
                  <div class="review-section">
                    <h2>もう一度、確かめよう</h2>

                    ${state.answers
                      .filter(answer => !answer.correct)
                      .map(answer => `
                        <details class="review-item">
                          <summary>
                            <span class="review-icon" aria-hidden="true">
                              ×
                            </span>
                            <span>${escape(answer.question.text)}</span>
                          </summary>

                          <p>
                            あなたの答え：
                            ${answer.selected === null
                              ? "時間切れ"
                              : escape(answer.selected)}
                          </p>

                          <p>
                            <strong>
                              正解：${escape(answer.question.answer)}
                            </strong>
                          </p>

                          <p>
                            ${escape(answer.question.explanation)}
                          </p>
                        </details>
                      `).join("")}
                  </div>
                `
                : ""}

              <p class="result-note">
                ${state.review
                  ? "解き直しは時間制限なしです。"
                  : "解き直しでは、選択肢の順番も変わります。"}
                再読み込みすると結果は消えます。
              </p>
            </section>
          </div>
        `;

        main.querySelector("#review")
          ?.addEventListener("click", startReview);

        main.querySelector("#again")
          .addEventListener("click", () => startSession());

        main.querySelector("#home")
          .addEventListener("click", () => renderHome(true));

        focusAfterPaint(".result-title", true);
      }

      // =========================================
      // 中断確認
      // =========================================

      function openQuit() {
        if (dialog.open) {
          return;
        }

        dialogOpenedAt = performance.now();
        clearTimer();
        dialog.showModal();
      }

      function resumeSession() {
        const pausedFor = Math.max(
          0,
          performance.now() - dialogOpenedAt
        );

        deadline += pausedFor;
        questionStarted += pausedFor;
        dialogOpenedAt = 0;

        if (
          state.phase === "question" &&
          !state.answers[state.index]
        ) {
          startTimer();
        }
      }

      document.querySelector("#resume")
        .addEventListener("click", () => {
          dialog.close("resume");
        });

      document.querySelector("#quit")
        .addEventListener("click", () => {
          dialog.close("quit");
        });

      dialog.addEventListener("close", () => {
        if (dialog.returnValue === "quit") {
          renderHome(true);
        } else {
          resumeSession();
        }

        dialog.returnValue = "";
      });

      document.querySelector(".brand")
        .addEventListener("click", event => {
          event.preventDefault();

          if (state.phase === "question") {
            openQuit();
          } else {
            renderHome(true);
          }
        });

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
          updateTimer();
        }
      });

      // パソコンでは1〜4キーでも選べる。
      document.addEventListener("keydown", event => {
        if (
          event.altKey ||
          event.ctrlKey ||
          event.metaKey ||
          event.repeat ||
          dialog.open ||
          state.phase !== "question" ||
          state.answers[state.index]
        ) {
          return;
        }

        if (/^[1-4]$/.test(event.key)) {
          event.preventDefault();
          submitAnswer(Number(event.key) - 1);
        }
      });

      // =========================================
      // 現在の状態
      // =========================================

      function getPublicState() {
        if (state.phase === "home") {
          return {
            phase: "home",
            settings: { ...options },
            availableQuestions: questions.length
          };
        }

        if (state.phase === "results") {
          const score = scoreAnswers(state.answers);

          return {
            phase: "results",
            review: state.review,
            correct: score.correct,
            total: score.total,
            missed: score.missed.length
          };
        }

        const question = state.deck[state.index];
        const answer = state.answers[state.index];

        return {
          phase: "question",
          review: state.review,
          number: state.index + 1,
          total: state.deck.length,
          subject: findSubject(question.subject).name,
          question: question.text,
          choices: [...question.options],
          answered: Boolean(answer),
          paused: dialog.open,

          secondsLeft: !state.review && options.seconds
            ? Math.max(
                0,
                Math.ceil(
                  (
                    deadline -
                    (dialog.open ? dialogOpenedAt : performance.now())
                  ) / 1000
                )
              )
            : null,

          ...(answer
            ? {
                correct: answer.correct,
                answer: question.answer,
                explanation: question.explanation
              }
            : {})
        };
      }

      // 最初の画面を表示。
      renderHome();

      // 対応ブラウザだけで使われる補助機能。
      // 通常のブラウザでは、この部分を使わずにクイズが動く。
      const modelContext = document.modelContext;

      if (modelContext?.registerTool) {
        const lifecycle = new AbortController();

        const emptySchema = {
          type: "object",
          properties: {},
          additionalProperties: false
        };

        function assertObject(input, allowed = []) {
          if (
            !input ||
            typeof input !== "object" ||
            Array.isArray(input) ||
            Object.keys(input).some(key => !allowed.includes(key))
          ) {
            throw new Error("入力形式が正しくありません。");
          }

          return input;
        }

        async function afterPaint(result) {
          await new Promise(resolve => requestAnimationFrame(resolve));
          return result;
        }

        const specs = [
          {
            name: "read_quiz_state",
            title: "今の学習画面を確認",
            description: "現在の問題、選択肢、回答済みの解説や結果を読みます。未回答の正解は返しません。",
            inputSchema: emptySchema,
            annotations: { readOnlyHint: true },
            execute(input) {
              assertObject(input);
              return getPublicState();
            }
          },
          {
            name: "start_quiz",
            title: "クイズを始める",
            description: "ホームまたは結果画面から5教科のクイズを始めます。",
            inputSchema: {
              type: "object",
              properties: {
                count: { type: "integer", enum: [5, 10] },
                seconds: { type: "integer", enum: [0, 30, 60] }
              },
              required: ["count", "seconds"],
              additionalProperties: false
            },
            execute(input) {
              const value = assertObject(input, ["count", "seconds"]);
              return afterPaint(startSession(value));
            }
          },
          {
            name: "answer_quiz_question",
            title: "問題に回答する",
            description: "現在の問題の選択肢を0〜3の番号で選び、回答を確定します。",
            inputSchema: {
              type: "object",
              properties: {
                choiceIndex: {
                  type: "integer",
                  minimum: 0,
                  maximum: 3
                }
              },
              required: ["choiceIndex"],
              additionalProperties: false
            },
            execute(input) {
              const value = assertObject(input, ["choiceIndex"]);

              if (!Number.isInteger(value.choiceIndex)) {
                throw new Error("選択肢の番号が必要です。");
              }

              return afterPaint(submitAnswer(value.choiceIndex));
            }
          },
          {
            name: "next_quiz_question",
            title: "次の問題へ進む",
            description: "回答後の解説から次の問題に進みます。最後なら結果を表示します。",
            inputSchema: emptySchema,
            execute(input) {
              assertObject(input);
              return afterPaint(nextQuestion());
            }
          },
          {
            name: "start_mistake_review",
            title: "解き直しを始める",
            description: "結果画面から、まちがえた問題を時間制限なしで解き直します。",
            inputSchema: emptySchema,
            execute(input) {
              assertObject(input);
              return afterPaint(startReview());
            }
          }
        ];

        for (const spec of specs) {
          try {
            Promise.resolve(
              modelContext.registerTool(
                {
                  ...spec,
                  annotations: {
                    readOnlyHint: false,
                    untrustedContentHint: false,
                    ...spec.annotations
                  }
                },
                { signal: lifecycle.signal }
              )
            ).catch(() => {});
          } catch {
            // 補助機能が使えなくても、通常のクイズには影響しない。
          }
        }

        window.addEventListener("pagehide", event => {
          if (!event.persisted) {
            lifecycle.abort();
          }
        });
      }
    })();
  </script>
</body>
</html>
